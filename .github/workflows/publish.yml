name: Build and Release Executables

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/ue_legacy_launcher/**/*.py'

jobs:
  bump_version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version_tag: ${{ steps.get_tag.outputs.latest_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools bump-my-version pyinstaller requests colorama pySmartDL pyyaml
          pip install .

      - name: Automate Version Bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main
          bump-my-version bump patch
          git push origin main --follow-tags

      - name: Export latest tag
        id: get_tag
        run: |
          git fetch --tags
          echo "latest_tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

  build_binaries:
    needs: bump_version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: uell-linux
            separator: ":"
            is_termux: "0"
          - os: windows-latest
            artifact_name: uell-windows.exe
            separator: ";"
            is_termux: "0"
          - os: macos-latest
            artifact_name: uell-macos
            separator: ":"
            is_termux: "0"
          - os: ubuntu-24.04-arm
            artifact_name: uell-termux-arm64
            separator: ":"
            is_termux: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.bump_version.outputs.version_tag }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools bump-my-version pyinstaller requests colorama pySmartDL pyyaml
          pip install .

      - name: Build Executable with PyInstaller
        env:
          TERMUX_VERSION: ${{ matrix.is_termux == '1' && 'ci' || '' }}
        run: |
          pyinstaller --onefile --name ${{ matrix.artifact_name }} --paths src --add-data "src/ue_legacy_launcher/*.keystore${{ matrix.separator }}ue_legacy_launcher" run_cli.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  publish_release:
    needs:
      - bump_version
      - build_binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump_version.outputs.version_tag }}
          make_latest: true
          files: |
            dist/uell-windows.exe
            dist/uell-linux
            dist/uell-macos
            dist/uell-termux-arm64
